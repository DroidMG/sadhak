<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadhak 🧘 | Your Spiritual Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#FF7A00"/>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sadhak 🧘</h1>
            <p>Plan your Purascharan with ease and devotion.</p>
        </header>

        <main class="card">
            <div class="input-group">
                <label for="purascharanName">🙏 Purascharan Name:</label>
                <input type="text" id="purascharanName" placeholder="e.g., Gayatri Purascharan">
            </div>

            <div class="input-group">
                <label for="japaCount">📿 Total Japa Count:</label>
                <input type="number" id="japaCount" value="100000">
            </div>

            <div class="input-group">
                <label for="sadhanaDays">🗓️ How many days will you perform this sadhana?</label>
                <input type="number" id="sadhanaDays" min="1" placeholder="e.g., 40">
            </div>

            <div class="input-group">
                <label for="startDate">Select your start date:</label>
                <input type="date" id="startDate">
            </div>
             <p class="end-date-display" id="endDateResult"></p>

            <div class="input-group">
                <label>🔥 Will you be performing the associated angas?</label>
                <div class="button-group">
                    <button id="angasYes" class="option-button">Yes</button>
                    <button id="angasNo" class="option-button">No</button>
                </div>
            </div>
        </main>

        <div id="resultsCard" class="card results-hidden">
            <h2>✨ Your Sadhana Plan ✨</h2>
            <div id="resultsContent">
                <!-- Results will be injected here by JavaScript -->
            </div>
            <button id="saveAsImage" class="action-button">📸 Save as Image</button>
        </div>

    </div>

    <footer>
        <p>© Copyright DroidMG 2025</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
